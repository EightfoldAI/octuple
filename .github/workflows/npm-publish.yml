name: Publish Octuple

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: 20.13.0
  # npm trusted publishing requires Node >= 22.14.0
  PUBLISH_NODE_VERSION: 22
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: yarn
      - run: yarn test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # ncipollo/release-action creates the GitHub release
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - name: Get version from tag
        id: tag_name
        run: |
          echo ::set-output name=current_version::${GITHUB_REF#refs/tags/v}
        shell: bash
      - name: Prerelease check
        id: prerelease_check
        if: contains(steps.tag_name.outputs.current_version, '-')
        run: |
          echo ::set-output name=prerelease::true
      - name: Checkout code
        uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PUBLISH_NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Upgrade npm
        run: npm install -g npm@11
      - name: Run Yarn
        run: yarn
      # Auth comes from npm trusted publishing (OIDC), not a stored token.
      # Provenance is generated automatically for this public repo.
      - name: Publish release to npm
        if: steps.prerelease_check.outputs.prerelease != 'true'
        run: npm publish
      - name: Publish prerelease to npm
        if: steps.prerelease_check.outputs.prerelease == 'true'
        run: npm publish --tag prerelease
      - name: Get Changelog Entry
        id: changelog_reader
        uses: artlaman/conventional-changelog-reader-action@v1.1.0
        with:
          version: ${{ steps.tag_name.outputs.current_version }}
          path: ./CHANGELOG.md
      - name: Create/update release
        uses: ncipollo/release-action@v1
        with:
          name: Release ${{ steps.changelog_reader.outputs.version }}
          body: ${{ steps.changelog_reader.outputs.changes }}
          prerelease: ${{ steps.prerelease_check.outputs.prerelease == 'true' }}
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn build-storybook
        if: steps.prerelease_check.outputs.prerelease != 'true'
      - name: Pushes to another repository
        if: steps.prerelease_check.outputs.prerelease != 'true'
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: 'storybook-static'
          destination-github-username: 'EightfoldAI'
          destination-repository-name: 'octuple.github.io'
          user-email: eightfold@users.noreply.github.com
          target-branch: main
